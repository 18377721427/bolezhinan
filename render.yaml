services:
  - type: web
    name: bolezhinan
    env: python
    region: singapore
    buildCommand: pip install -r requirements.txt
    startCommand: gunicorn app:app --bind 0.0.0.0:$PORT --workers 2 --timeout 120
    envVars:
      - key: SECRET_KEY
        generateValue: true
      - key: DATABASE_URL
        value: sqlite:////data/bolezhinan.db
      - key: PYTHON_VERSION
        value: "3.11"
    disk:
      name: sqlite-data
      mountPath: /data
      sizeGB: 1
