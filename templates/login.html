<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>伯乐职南 · 登录</title>
<link rel="stylesheet" href="/static/style.css">
<style>
.login-wrap {
  min-height: 100vh;
  display: flex;
  align-items: center;
  justify-content: center;
  background: linear-gradient(135deg, #0f1724 0%, #1a2a44 50%, #0f3460 100%);
}
.login-card {
  background: #fff;
  border-radius: 14px;
  padding: 40px 36px;
  width: 380px;
  max-width: 90%;
  box-shadow: 0 8px 40px rgba(0,0,0,0.2);
}
.login-card h1 {
  font-size: 22px;
  font-weight: 700;
  color: #0f1724;
  text-align: center;
  margin-bottom: 4px;
}
.login-card .sub {
  text-align: center;
  color: #6b7a8f;
  font-size: 13px;
  margin-bottom: 28px;
}
.login-card .form-group { margin-bottom: 16px; }
.login-card label {
  display: block;
  font-size: 13px;
  font-weight: 600;
  color: #1a2332;
  margin-bottom: 4px;
}
.login-card input {
  width: 100%;
  padding: 10px 14px;
  border: 1px solid #e2e6ed;
  border-radius: 8px;
  font-size: 14px;
  outline: none;
}
.login-card input:focus {
  border-color: #c9a961;
  box-shadow: 0 0 0 3px rgba(201,169,97,0.12);
}
.login-card .btn-login {
  width: 100%;
  padding: 12px;
  background: #c9a961;
  color: #0f1724;
  border: none;
  border-radius: 8px;
  font-size: 15px;
  font-weight: 700;
  cursor: pointer;
  transition: all 0.2s;
  margin-top: 4px;
}
.login-card .btn-login:hover { background: #e0c878; }
.login-card .error {
  background: #fef2f2;
  color: #d94a4a;
  padding: 8px 12px;
  border-radius: 6px;
  font-size: 13px;
  margin-bottom: 12px;
  display: none;
}
.login-card .error.show { display: block; }
.login-card .foot {
  text-align: center;
  margin-top: 18px;
  font-size: 12px;
  color: #9aa8b9;
}
</style>
</head>
<body>
<div class="login-wrap">
  <div class="login-card">
    <h1>伯乐职南</h1>
    <p class="sub">沙龙运营管理系统</p>
    <div id="errorMsg" class="error">用户名或密码错误</div>
    <div class="form-group">
      <label>用户名</label>
      <input type="text" id="username" placeholder="请输入用户名" autofocus>
    </div>
    <div class="form-group">
      <label>密码</label>
      <input type="password" id="password" placeholder="请输入密码" onkeydown="if(event.key==='Enter') login()">
    </div>
    <button class="btn-login" onclick="login()">登 录</button>
    <div class="foot">演示账号：admin / admin123</div>
  </div>
</div>
<script>
async function login() {
  const btn = document.querySelector('.btn-login');
  btn.disabled = true; btn.textContent = '登录中…';
  const err = document.getElementById('errorMsg');
  err.classList.remove('show');
  try {
    const resp = await fetch('/api/login', {
      method: 'POST',
      headers: {'Content-Type': 'application/json'},
      body: JSON.stringify({username: username.value, password: password.value})
    });
    const data = await resp.json();
    if (data.ok) { window.location.href = '/admin'; }
    else { err.textContent = data.error || '登录失败'; err.classList.add('show'); }
  } catch(e) { err.textContent = '网络错误'; err.classList.add('show'); }
  finally { btn.disabled = false; btn.textContent = '登 录'; }
}
</script>
</body>
</html>
